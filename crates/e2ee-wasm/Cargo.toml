[package]
name = "e2ee-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# `cdylib` for the wasm artifact; `rlib` so the crate still builds/tests natively
# as an ordinary workspace member.
crate-type = ["cdylib", "rlib"]

[dependencies]
app = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.126"

# On wasm32 the crypto's `OsRng` is backed by the browser's `crypto.getRandomValues`
# — the `js` feature wires getrandom to it. Only pulled in for wasm builds, so the
# native rlib (and `cargo build --workspace`) is unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
