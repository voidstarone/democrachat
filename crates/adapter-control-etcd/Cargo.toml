# etcd implementation of the federation control plane (M4).
#
# Backs `federation::OwnershipRegistry` with etcd's lease + compare-and-swap
# primitives: ownership is a lease the owner heartbeats, epochs are a persistent
# monotonic counter bumped atomically on each claim (the fencing token), and node
# public keys, load, standbys, and the rehoming opt-out live under well-known
# prefixes. etcd is itself an HA, consensus-backed cluster, so the control plane
# is not a single point of failure. See docs/federation.md §6.
[package]
name = "adapter-control-etcd"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domain = { workspace = true }
federation = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
etcd-client = { workspace = true }

[dev-dependencies]
# Integration tests drive a REAL etcd, gated on the TEST_ETCD_ENDPOINT env var
# (skipped when unset, so `cargo test` stays green with no etcd running).
tokio = { workspace = true }
