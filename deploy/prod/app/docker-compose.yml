# ============================================================================
# APP HOST — the stateful democrachat node (e.g. a Raspberry Pi 5 on Ubuntu).
#
# democrachat is a single process with an in-memory model persisted to one JSON
# snapshot. It is NOT sharded or replicated (there is no federation like the
# democratos sibling), so exactly ONE app host runs, and it owns the durable
# data + media. This host is the source of truth; the edge host in ../edge (or an
# existing Caddy elsewhere, e.g. a separate Pi 4) is a stateless proxy in front.
#
#   edge host (public 80/443)  ──LAN──▶  this host  ${APP_BIND}  ──▶  app:3737
#
# Everything is env-driven — copy .env.example to .env and edit. Durable state
# lives on host paths you choose (${DATA_DIR}, ${MEDIA_DIR}), so it belongs on an
# external drive rather than the SD card (which wears out under the DB's per-write
# saves). Media in particular is placed on ${MEDIA_DIR}.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
# ============================================================================

services:
  app:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: ${IMAGE:-democrachat:latest}
    restart: unless-stopped
    # Run as the host user that owns ${DATA_DIR}/${MEDIA_DIR}, so the bind mounts
    # are writable (the image's built-in `app` user won't match host ownership on
    # an external drive). Default 1000:1000 — the first Ubuntu login user.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Publish on the LAN interface only (host-IP-scoped), never 0.0.0.0. The edge
    # host reverse-proxies to ${APP_BIND}. Compose refuses to start if APP_BIND is
    # unset, so the app is never accidentally bound to every interface.
    ports:
      - "${APP_BIND:?set APP_BIND to this host's LAN ip:port, e.g. 192.168.1.5:3737}:3737"
    environment:
      # REQUIRED. A non-loopback bind makes the app fail-closed without a real
      # secret. Keep it stable across restarts (else every live session cookie is
      # invalidated) — generate once with: openssl rand -hex 32
      DEMOCRACHAT_SESSION_SECRET: ${DEMOCRACHAT_SESSION_SECRET:?set a strong random DEMOCRACHAT_SESSION_SECRET in .env}
      # Cookies carry Secure because the public origin (at the edge) is HTTPS.
      DEMOCRACHAT_SECURE_COOKIES: "1"
      # The JSON snapshot (the whole database) and the media blob tier live on the
      # host paths bind-mounted below.
      DEMOCRACHAT_DATA: /data/democrachat.json
      DEMOCRACHAT_MEDIA_DIR: /media
      # Optional at-rest encryption of the snapshot: 64 hex chars, else empty (the
      # app treats empty as "plaintext"). Generate with: openssl rand -hex 32
      DEMOCRACHAT_DATA_KEK: ${DEMOCRACHAT_DATA_KEK:-}
      # Node identity — leave 0 (single box). A federated node would set 1–65535.
      DEMOCRACHAT_NODE_ID: ${DEMOCRACHAT_NODE_ID:-0}
      # Public base URL the verification link is built from (usually the edge's
      # https://SITE_ADDRESS).
      DEMOCRACHAT_BASE_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS (the public host, e.g. chat.example.com)}
      # ---- Email verification (signup) ----
      # hard (default) requires the key + SMTP settings below; the app fails closed
      # without them. Set to off to disable verification.
      DEMOCRACHAT_EMAIL_VERIFICATION: ${DEMOCRACHAT_EMAIL_VERIFICATION:-hard}
      # Days a founding member's vote stands before it needs a confirmed address
      # (soft mode). 0 = confirm first, then vote.
      DEMOCRACHAT_FRANCHISE_GRACE_DAYS: ${DEMOCRACHAT_FRANCHISE_GRACE_DAYS:-28}
      # Dedicated key: addresses are encrypted at rest under this (never plaintext).
      DEMOCRACHAT_EMAIL_KEY: ${DEMOCRACHAT_EMAIL_KEY:-}
      # ---- Bootstrap phases ----
      # Citizens needed to leave Seed / reach Sovereign. CHARTERING_AT bounds a
      # server's founding cohort and decides when amendments unlock; must be >= 2.
      DEMOCRACHAT_CHARTERING_AT: ${DEMOCRACHAT_CHARTERING_AT:-5}
      DEMOCRACHAT_SOVEREIGN_AT: ${DEMOCRACHAT_SOVEREIGN_AT:-25}
      # SMTP submission relay. HOST is the mail host's address on the LAN (the app
      # host and the mail/Postfix host may be different boxes).
      DEMOCRACHAT_SMTP_HOST: ${DEMOCRACHAT_SMTP_HOST:-}
      DEMOCRACHAT_SMTP_PORT: ${DEMOCRACHAT_SMTP_PORT:-587}
      DEMOCRACHAT_SMTP_STARTTLS: ${DEMOCRACHAT_SMTP_STARTTLS:-true}
      DEMOCRACHAT_SMTP_USERNAME: ${DEMOCRACHAT_SMTP_USERNAME:-}
      DEMOCRACHAT_SMTP_PASSWORD: ${DEMOCRACHAT_SMTP_PASSWORD:-}
      DEMOCRACHAT_SMTP_FROM: ${DEMOCRACHAT_SMTP_FROM:-}
      # 1 if the relay's submission TLS cert name doesn't match DEMOCRACHAT_SMTP_HOST.
      DEMOCRACHAT_SMTP_INSECURE_TLS: ${DEMOCRACHAT_SMTP_INSECURE_TLS:-}
    volumes:
      # Durable state on host paths you choose (an external drive, ext4). The DB
      # snapshot and the media blobs are separate tiers; media is the large one.
      - "${DATA_DIR:?set DATA_DIR to a host path on your durable drive, e.g. /mnt/ssd/democrachat/data}:/data"
      - "${MEDIA_DIR:?set MEDIA_DIR to a host path on your external drive, e.g. /mnt/ssd/democrachat/media}:/media"
    # ---- kernel-level hardening (identical to the single-box compose) ----
    read_only: true                 # root FS immutable; the two binds above stay writable
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ---- resource guards (configurable; defaults sized for a Pi 5) ----
    mem_limit: ${APP_MEM:-512m}
    cpus: "${APP_CPUS:-2.0}"
    pids_limit: ${APP_PIDS:-256}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3737/"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
